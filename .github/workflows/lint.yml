name: CI Lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/setup-devenv

      - run: devenv shell npm run build

      - name: Run pre-commit
        run: devenv shell pre-commit run --all-files

      - name: Run tsc
        run: devenv shell npm run lint:tsc

      - name: Run tsc
        run: devenv shell npm -C example/ run lint:tsc
